<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <defs>
    <!-- 黑色筹码主体 -->
    <radialGradient id="chipBodyBlack" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="30%" stop-color="#2a2a2a"/>
      <stop offset="70%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>

    <!-- 内圈米白 -->
    <radialGradient id="chipInnerCream" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff8e7"/>
      <stop offset="60%" stop-color="#f0e8d0"/>
      <stop offset="100%" stop-color="#d0c8a8"/>
    </radialGradient>

    <!-- 金边 -->
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0a0"/>
      <stop offset="25%" stop-color="#ffd700"/>
      <stop offset="60%" stop-color="#daa520"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>

    <!-- 高光 -->
    <linearGradient id="blackShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- 投影 -->
    <radialGradient id="blackShadow" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.4)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <!-- 投影 -->
  <ellipse cx="30" cy="56" rx="22" ry="4" fill="url(#blackShadow)"/>

  <!-- 黑色外圈 -->
  <circle cx="30" cy="28" r="26" fill="url(#chipBodyBlack)"/>

  <!-- 金边齿边 -->
  <g fill="url(#goldRing)">
    <rect x="28" y="2" width="4" height="6" transform="rotate(15 30 28)"/>
    <rect x="28" y="2" width="4" height="6" transform="rotate(45 30 28)"/>
    <rect x="28" y="2" width="4" height="6" transform="rotate(75 30 28)"/>
    <rect x="28" y="2" width="4" height="6" transform="rotate(105 30 28)"/>
    <rect x="28" y="2" width="4" height="6" transform="rotate(135 30 28)"/>
    <rect x="28" y="2" width="4" height="6" transform="rotate(165 30 28)"/>
    <rect x="28" y="2" width="4" height="6" transform="rotate(195 30 28)"/>
    <rect x="28" y="2" width="4" height="6" transform="rotate(225 30 28)"/>
    <rect x="28" y="2" width="4" height="6" transform="rotate(255 30 28)"/>
    <rect x="28" y="2" width="4" height="6" transform="rotate(285 30 28)"/>
    <rect x="28" y="2" width="4" height="6" transform="rotate(315 30 28)"/>
    <rect x="28" y="2" width="4" height="6" transform="rotate(345 30 28)"/>
  </g>

  <!-- 双金环 -->
  <circle cx="30" cy="28" r="22" fill="none" stroke="url(#goldRing)" stroke-width="2.5"/>
  <circle cx="30" cy="28" r="20" fill="none" stroke="rgba(255,215,0,0.3)" stroke-width="0.8"/>

  <!-- 内圈 -->
  <circle cx="30" cy="28" r="17" fill="url(#chipInnerCream)"/>
  <circle cx="30" cy="28" r="17" fill="none" stroke="url(#goldRing)" stroke-width="1.5"/>

  <!-- 中心图案：方片♦ + 500面值 -->
  <g transform="translate(30, 28)">
    <!-- 方片钻石 -->
    <path d="M0,-7 L5,0 L0,7 L-5,0 Z" fill="#1a1a1a" opacity="0.9"/>
    <path d="M0,-5 L3.5,0 L0,5 L-3.5,0 Z" fill="#2a2a2a"/>

    <!-- 面值 500 -->
    <text x="0" y="13" text-anchor="middle"
          font-family="Georgia, serif" font-size="8" font-weight="bold"
          fill="#1a1a1a">500</text>
  </g>

  <!-- 光泽 -->
  <ellipse cx="22" cy="20" rx="7" ry="4.5" fill="url(#blackShine)" opacity="0.6"/>
  <ellipse cx="20" cy="17" rx="3.5" ry="2" fill="rgba(255,255,255,0.6)"/>

  <!-- 底部厚度 -->
  <path d="M8,46 Q30,52 52,46 L52,48 Q30,54 8,48 Z"
        fill="#000000" opacity="0.5"/>
</svg>
