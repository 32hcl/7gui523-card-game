<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <defs>
    <radialGradient id="chipBodyGreen" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="30%" stop-color="#22c55e"/>
      <stop offset="70%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#166534"/>
    </radialGradient>

    <radialGradient id="chipInnerWhite" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0f0e8"/>
      <stop offset="100%" stop-color="#d0d0c0"/>
    </radialGradient>

    <linearGradient id="whiteGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0a0"/>
      <stop offset="30%" stop-color="#ffd700"/>
      <stop offset="70%" stop-color="#daa520"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>

    <linearGradient id="greenShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <radialGradient id="greenShadow" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.3)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <ellipse cx="30" cy="56" rx="22" ry="4" fill="url(#greenShadow)"/>

  <circle cx="30" cy="28" r="26" fill="url(#chipBodyGreen)"/>

  <!-- 金边齿边 -->
  <g fill="url(#whiteGold)">
    <rect x="28" y="2" width="4" height="6" transform="rotate(0 30 28)"/>
    <rect x="28" y="2" width="4" height="6" transform="rotate(36 30 28)"/>
    <rect x="28" y="2" width="4" height="6" transform="rotate(72 30 28)"/>
    <rect x="28" y="2" width="4" height="6" transform="rotate(108 30 28)"/>
    <rect x="28" y="2" width="4" height="6" transform="rotate(144 30 28)"/>
    <rect x="28" y="2" width="4" height="6" transform="rotate(180 30 28)"/>
    <rect x="28" y="2" width="4" height="6" transform="rotate(216 30 28)"/>
    <rect x="28" y="2" width="4" height="6" transform="rotate(252 30 28)"/>
    <rect x="28" y="2" width="4" height="6" transform="rotate(288 30 28)"/>
    <rect x="28" y="2" width="4" height="6" transform="rotate(324 30 28)"/>
  </g>

  <circle cx="30" cy="28" r="22" fill="none" stroke="url(#whiteGold)" stroke-width="2"/>
  <circle cx="30" cy="28" r="19" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.8"/>

  <circle cx="30" cy="28" r="17" fill="url(#chipInnerWhite)"/>
  <circle cx="30" cy="28" r="17" fill="none" stroke="url(#whiteGold)" stroke-width="1.5"/>

  <!-- 中心：红心♥ + 25 -->
  <g transform="translate(30, 28)">
    <path d="M0,4 C-6,-4 -6,-10 0,-5 C6,-10 6,-4 0,4 Z"
          fill="#166534" opacity="0.85"/>
    <text x="0" y="13" text-anchor="middle"
          font-family="Georgia, serif" font-size="9" font-weight="bold"
          fill="#166534">25</text>
  </g>

  <ellipse cx="22" cy="20" rx="8" ry="5" fill="url(#greenShine)" opacity="0.65"/>
  <ellipse cx="20" cy="17" rx="4" ry="2.5" fill="rgba(255,255,255,0.7)"/>

  <path d="M8,46 Q30,52 52,46 L52,48 Q30,54 8,48 Z"
        fill="#14532d" opacity="0.5"/>
</svg>
