<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <defs>
    <!-- 红色筹码主体渐变 -->
    <radialGradient id="chipBodyRed" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="30%" stop-color="#e63946"/>
      <stop offset="70%" stop-color="#c41e3a"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </radialGradient>

    <!-- 内圈白色渐变 -->
    <radialGradient id="chipInner" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f5f0e0"/>
      <stop offset="100%" stop-color="#d8cfb8"/>
    </radialGradient>

    <!-- 金边渐变 -->
    <linearGradient id="chipGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0a0"/>
      <stop offset="25%" stop-color="#ffd700"/>
      <stop offset="60%" stop-color="#daa520"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>

    <!-- 光泽高光 -->
    <linearGradient id="chipShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- 侧面阴影 -->
    <radialGradient id="chipShadow" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.3)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <!-- 底部投影 -->
  <ellipse cx="30" cy="56" rx="22" ry="4" fill="url(#chipShadow)"/>

  <!-- 筹码外圈（红色主体） -->
  <circle cx="30" cy="28" r="26" fill="url(#chipBodyRed)"/>

  <!-- 外圈金边装饰（菱形齿边） -->
  <g fill="url(#chipGold)">
    <!-- 12个菱形齿边 -->
    <rect x="28" y="2" width="4" height="6" transform="rotate(0 30 28)"/>
    <rect x="28" y="2" width="4" height="6" transform="rotate(30 30 28)"/>
    <rect x="28" y="2" width="4" height="6" transform="rotate(60 30 28)"/>
    <rect x="28" y="2" width="4" height="6" transform="rotate(90 30 28)"/>
    <rect x="28" y="2" width="4" height="6" transform="rotate(120 30 28)"/>
    <rect x="28" y="2" width="4" height="6" transform="rotate(150 30 28)"/>
    <rect x="28" y="2" width="4" height="6" transform="rotate(180 30 28)"/>
    <rect x="28" y="2" width="4" height="6" transform="rotate(210 30 28)"/>
    <rect x="28" y="2" width="4" height="6" transform="rotate(240 30 28)"/>
    <rect x="28" y="2" width="4" height="6" transform="rotate(270 30 28)"/>
    <rect x="28" y="2" width="4" height="6" transform="rotate(300 30 28)"/>
    <rect x="28" y="2" width="4" height="6" transform="rotate(330 30 28)"/>
  </g>

  <!-- 金环（内圈金边） -->
  <circle cx="30" cy="28" r="22" fill="none" stroke="url(#chipGold)" stroke-width="2"/>
  <circle cx="30" cy="28" r="19" fill="none" stroke="rgba(255,215,0,0.4)" stroke-width="0.8"/>

  <!-- 内圈白色中心 -->
  <circle cx="30" cy="28" r="17" fill="url(#chipInner)"/>

  <!-- 内圈金边 -->
  <circle cx="30" cy="28" r="17" fill="none" stroke="url(#chipGold)" stroke-width="1.5"/>

  <!-- 中心面值：♠ 符号 + 数字 -->
  <g transform="translate(30, 28)">
    <!-- 黑桃符号装饰 -->
    <path d="M0,-6 C-5,-2 -7,2 -4,5 C-2,6 0,5 0,4 C0,5 2,6 4,5 C7,2 5,-2 0,-6 Z"
          fill="#c41e3a" opacity="0.8"/>
    <rect x="-1" y="4" width="2" height="5" fill="#c41e3a" opacity="0.8"/>

    <!-- 面值数字（下方） -->
    <text x="0" y="13" text-anchor="middle"
          font-family="Georgia, serif" font-size="9" font-weight="bold"
          fill="#c41e3a">100</text>
  </g>

  <!-- 光泽高光（左上） -->
  <ellipse cx="22" cy="20" rx="8" ry="5" fill="url(#chipShine)" opacity="0.7"/>
  <ellipse cx="20" cy="17" rx="4" ry="2.5" fill="rgba(255,255,255,0.8)"/>

  <!-- 底部侧面阴影（筹码厚度感） -->
  <path d="M8,46 Q30,52 52,46 L52,48 Q30,54 8,48 Z"
        fill="#5c0e14" opacity="0.6"/>
</svg>
