name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            _ci/godot_executable
            _ci/templates
          key: godot-4.7.2-stable-v2

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p _ci/templates
          echo "--- Downloading Godot engine ---"
          curl -fsSL -o _ci/godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q _ci/godot.zip -d _ci/
          mv _ci/Godot_v4.7.2-stable_linux.x86_64 _ci/godot_executable
          echo "--- Downloading export templates ---"
          curl -fsSL -o _ci/templates.tpz "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          unzip -q _ci/templates.tpz -d _ci/templates/

      - name: Setup Godot templates
        run: |
          chmod +x _ci/godot_executable
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          cp -r _ci/templates/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Export Web (HTML5)
        run: |
          mkdir -p 7gui523_godot/build/web
          _ci/godot_executable --headless --path 7gui523_godot --export-release "Web" build/web/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 7gui523_godot/build/web

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4