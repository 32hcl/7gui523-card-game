name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  export-all:
    name: Export All Platforms
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: Windows Desktop
            artifact: 7gui523-win64
          - preset: Android
            artifact: 7gui523-android
          - preset: Web
            artifact: 7gui523-web
    steps:
      - uses: actions/checkout@v4

      - name: Export ${{ matrix.preset }}
        uses: game-ci/godot-export@v1
        with:
          godot-version: '4.4.1'
          preset: ${{ matrix.preset }}
          project-path: 7gui523_godot
          relative-export-path: build/${{ matrix.artifact }}

      - name: Zip
        run: |
          cd 7gui523_godot/build/${{ matrix.artifact }}
          zip -r ../../../../${{ matrix.artifact }}.zip *

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    name: Create Release
    needs: export-all
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            自动构建版本 — 提交 ${{ github.sha }}

            | 平台 | 文件 |
            |------|------|
            | Windows | 7gui523-win64.zip |
            | Android | 7gui523-android.zip |
            | Web     | 7gui523-web.zip |
          files: |
            artifacts/7gui523-win64.zip
            artifacts/7gui523-android.zip
            artifacts/7gui523-web.zip
          draft: false
          prerelease: false