name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  export-all:
    name: Export All Platforms
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: "Windows Desktop"
            artifact: 7gui523-win64
            ext: exe
          - preset: Android
            artifact: 7gui523-android
            ext: apk
          - preset: Web
            artifact: 7gui523-web
            ext: html

    steps:
      - uses: actions/checkout@v4

      - name: Download Godot
        run: |
          GODOT_VER="4.4.1"
          GODOT_BASENAME="Godot_v${GODOT_VER}-stable_linux.x86_64"
          TPL_BASENAME="Godot_v${GODOT_VER}-stable_export_templates.tpz"

          echo "Downloading Godot ${GODOT_VER}..."
          curl -sSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VER}-stable/${GODOT_BASENAME}.zip"
          unzip -q godot.zip
          mv ${GODOT_BASENAME} /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

          echo "Downloading export templates..."
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VER}-stable/${TPL_BASENAME}"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VER}.stable
          unzip -q templates.tpz -d ~/.local/share/godot/export_templates/${GODOT_VER}.stable
          mv ~/.local/share/godot/export_templates/${GODOT_VER}.stable/templates/* ~/.local/share/godot/export_templates/${GODOT_VER}.stable/
          echo "Godot ready: $(godot --version)"

      - name: Setup Android (debug keystore)
        if: matrix.preset == 'Android'
        run: |
          keytool -genkey -v -keystore 7gui523_godot/debug.keystore -alias debug -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Debug, OU=Dev, O=32Hcl, L=City, S=State, C=CN" -noprompt

      - name: Export
        run: |
          mkdir -p build
          godot --headless --path 7gui523_godot --export-release "${{ matrix.preset }}" "../build/${{ matrix.artifact }}.${{ matrix.ext }}"

      - name: Zip
        run: |
          cd build
          zip -r ../${{ matrix.artifact }}.zip *

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    name: Create Release
    needs: export-all
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            自动构建版本

            | 平台 | 文件 |
            |------|------|
            | Windows | 7gui523-win64.zip |
            | Android | 7gui523-android.zip |
            | Web     | 7gui523-web.zip |
          files: |
            artifacts/**/*.zip
          draft: false
          prerelease: false